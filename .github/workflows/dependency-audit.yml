# Supply-chain watch: audits Vodou's Python dependencies (direct and
# transitive) against the PyPI/OSV advisory database on every push and PR, so a
# newly disclosed CVE in cryptography, fido2, PyQt6, or anything they pull in
# surfaces here instead of in a shipped release. It does not import or run the
# app — no Qt system libraries are needed, which keeps it fast and reliable.
name: Dependency audit

on:
  push:
    branches: [master, linux-support]
  pull_request:

# Read-only, and triggered by `pull_request` (not `pull_request_target`), so a
# PR from a fork is checked out without any repository credentials.
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      # Actions pinned to commit SHAs, not tags: a tag can be moved to point at
      # different code, and this job can read the repo.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.13"

      # Install the wheels (metadata only — no Qt runtime libs, since pip-audit
      # never imports them) so the whole resolved tree, transitive deps
      # included, is what actually gets audited.
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      # pip-audit exits non-zero when any installed package has a known
      # vulnerability, failing the job so the advisory can't slip by unnoticed.
      - name: Audit installed dependencies for known CVEs
        run: |
          python -m pip install --disable-pip-version-check pip-audit
          python -m pip_audit --progress-spinner off
